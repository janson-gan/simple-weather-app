<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icon only-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <!-- Main CSS only-->
    <link rel="stylesheet" href="css/styles.css">
    <title>International Weather App</title>
</head>

<body>
    <main class="wrapper">
        <header id="topHeader">
            <ul id="flexContainer">
                <li>
                    <h1 class="capitalize">Singapore</h1>
                    <time id="todayDate"></time>
                    <time id="currTime"></time>
                </li>
                <li>
                    <figure>
                        <img src="" alt="Weather icon" id="weatherIcon">
                        <div id="figureCaption">
                            <figcaption class="capitalize" id="tempDescription"></figcaption>
                            <p> <span id="temperature"></span></p>
                            <!-- <i class="bi bi-thermometer-half"></i><figcaption id="temperature"></figcaption> -->
                        </div>

                    </figure>
                </li>
                <li>
                    <div id="maxMinTemp">
                        <p><i class="bi bi-thermometer-sun"></i> <span id="maxTemp"></span></p>
                        <p><i class="bi bi-thermometer-snow"></i> <span id="minTemp"></span></p>
                    </div>
                </li>
            </ul>
        </header>

        <section>
            <div class="container" id="formWrapper">
                <form action="" onsubmit="event.preventDefault(); weatherQuery()">
                    <input type="text" name="country" id="country" class="form-control"
                        placeholder="Search for a country">
                    <div class="d-grid mt-2">
                        <button type="submit" class="btn btn-primary" id="formBtn">Check</button>
                    </div>
                </form>
            </div>
        </section>

        <div id="footNote">
            <p>Make with <i class="fa fa-heart" style="font-size:26px;color:red"></i> By Janson Gan</p>
        </div>
    </main>

    <!-- Config javascript -->
    <script src="js/config.js"></script>
    <!-- Main Javascript -->
    <script src="js/fetchApi.js"></script>
    <!-- Fontawesome -->
    <script src="https://kit.fontawesome.com/3dbe5ac0fa.js" crossorigin="anonymous"></script>
</body>

</html>
