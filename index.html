<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icon only-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <!-- Main CSS only-->
    <link rel="stylesheet" href="css/styles.css">
    <title>International Weather App</title>
</head>

<body>
    <main id="main-container">
        <header id="topHeader" class="card border-secondary mb-3">
            <div class="container-header">
                <h1 class="capitalize">Singapore</h1>
                <div style="text-align: center;">
                    <img src="" alt="Weather icon" id="weatherIcon">
                    <figcaption class="capitalize" id="tempDescription"></figcaption>
                </div>
                <!-- <time id="todayDate"></time>
                <time id="currTime"></time> -->
            </div>
            <div id="temp-container">
                <p> <span id="temperature"></span></p>
            </div>
            <div id="maxMinTemp">
                <p><i class="bi bi-thermometer-sun"></i> <span id="maxTemp"></span></p>
                <p><i class="bi bi-thermometer-snow"></i> <span id="minTemp"></span></p>
            </div>
        </header>

        <section id="form-container">
            <div class="container" id="formWrapper">
                <form action="" onsubmit="event.preventDefault(); weatherQuery()">
                    <input type="text" name="country" id="country" class="form-control"
                        placeholder="Search for a country">
                    <div class="d-grid mt-2">
                        <button type="submit" class="btn btn-primary" id="formBtn">Check</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>Make with <i class="fa fa-heart" style="font-size:26px;color:red"></i> By Janson Gan</p>
    </footer>

    <!-- Config javascript -->
    <script src="js/config.js"></script>
    <!-- Main Javascript -->
    <script src="js/fetchApi.js"></script>
    <!-- Fontawesome -->
    <script src="https://kit.fontawesome.com/3dbe5ac0fa.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
